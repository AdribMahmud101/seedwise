  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);

width=\"62\" height=\"20\" rx=\"3\" fill=\"#1d2a22\" fill-opacity=\"0.78\"><\u002Frect>\n                <text x=\"595\" y=\"264\" text-anchor=\"middle\" font-family=\"JetBrains Mono, monospace\" font-size=\"10\" letter-spacing=\"1\" fill=\"#fdfcf7\">{{ sat.beforeLabel }}<\u002Ftext>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:14px\">\n              <span style=\"font-size:12px; color:#5d6256; flex:none\">{{ sat.afterLabel }}<\u002Fspan>\n              <input type=\"range\" min=\"8\" max=\"92\" value=\"{{ sat.value }}\" sc-camel-on-change=\"{{ sat.onSlide }}\" aria-label=\"{{ ui.satBody }}\" style=\"flex:1; accent-color:#2b4a39; height:28px\">\n              <span style=\"font-size:12px; color:#5d6256; flex:none\">{{ sat.beforeLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; font-size:12.5px\">\n              <span style=\"width:12px; height:12px; border-radius:3px; background:{{ sat.overlay }}; opacity:.8\"><\u002Fspan>\n              <span style=\"color:#2c372f; font-weight:500\">{{ sat.legend }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0; font-size:12.5px; line-height:1.6; color:#5d6256\">{{ ui.satNote }}<\u002Fp>\n            <details style=\"border-top:1px solid #e3dfd0; padding-top:12px\">\n              <summary style=\"font-weight:600; font-size:13px\">{{ ui.sure }}<\u002Fsummary>\n              <p style=\"margin:10px 0 0; font-size:13px; line-height:1.6; color:#3d463f\">{{ ui.sureBody }}<\u002Fp>\n            <\u002Fdetails>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <!-- FOOTER -->\n      <footer style=\"display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; padding-top:20px; border-top:1px solid #e3dfd0; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#5d6256\">\n        <span>{{ ui.brand }} &nbsp;/&nbsp; {{ ui.siteName }}<\u002Fspan>\n        <span>{{ ui.footRight }}<\u002Fspan>\n      <\u002Ffooter>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;hazard&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;flood&quot;,&quot;drought&quot;,&quot;fire&quot;,&quot;storm&quot;],&quot;default&quot;:&quot;flood&quot;,&quot;section&quot;:&quot;Scenario&quot;},&quot;stage&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:1,&quot;max&quot;:4,&quot;step&quot;:1,&quot;default&quot;:3,&quot;section&quot;:&quot;Scenario&quot;},&quot;language&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;bn&quot;],&quot;default&quot;:&quot;en&quot;,&quot;section&quot;:&quot;Scenario&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3700}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { site: 2, hazard: null, stage: null, lang: null, checks: {}, ev: {}, slide: 58, saved: false };\n  }\n\n  renderVals() {\n    const s = this.state || {};\n    const lang = s.lang || this.props.language || 'en';\n    const bn = lang === 'bn';\n    const t = (a, b) => (bn ? b : a);\n    const dg = (v) => {\n      const x = String(v);\n      return bn ? x.replace(/\\d/g, (d) => '০১২৩৪৫৬৭৮৯'[Number(d)]) : x;\n    };\n    const hk = s.hazard || this.props.hazard || 'flood';\n    const stage = Math.min(4, Math.max(1, Number(s.stage || this.props.stage || 3)));\n    const alert = stage <= 2;\n    const siteIdx = s.site == null ? 2 : s.site;\n    const checksState = s.checks || {};\n    const evState = s.ev || {};\n\n    const MONO = \"font-family:'JetBrains Mono',monospace;\";\n\n    /* ---------- UI strings ---------- */\n    const ui = {\n      brand: t('Ropon Radar', 'রোপণ রাডার'),\n      brandAlt: t('রোপণ রাডার', 'Ropon Radar'),\n      workspace: t('Field workspace', 'ফিল্ড ওয়ার্কস্পেস'),\n      lab: t('Rangpur field lab', 'রংপুর ফিল্ড ল্যাব'),\n      labSub: t('Bangladesh · Three prepared sites', 'বাংলাদেশ · তিনটি প্রস্তুত এলাকা'),\n      edition: t('Field edition 01', 'ফিল্ড সংস্করণ ০১'),\n      crumb1: t('Rangpur', 'রংপুর'),\n      crumb2: t('Disaster recovery', 'দুর্যোগ পুনরুদ্ধার'),\n      hist: t('Historical data / 2024', 'ঐতিহাসিক তথ্য / ২০২৪'),\n      eyebrow: t('Resilience desk / 08', 'রিজিলিয়েন্স ডেস্ক / ০৮'),\n      title: t('A way forward after disaster', 'দুর্যোগের পর এগিয়ে যাওয়ার পথ'),\n      sub: t('Protect people. Check the field. Find the next planting opportunity.', 'মানুষকে রক্ষা করুন। জমি দেখুন। পরের রোপণের সুযোগ খুঁজুন।'),\n      notice: t('Choose the situation you want to plan for. Conditions below come from you. This page does not monitor active emergencies.', 'যে পরিস্থিতির জন্য পরিকল্পনা করতে চান তা বেছে নিন। নিচের অবস্থা আপনার দেওয়া তথ্য থেকে আসে। এই পাতা সক্রিয় জরুরি অবস্থা পর্যবেক্ষণ করে না।'),\n      emTitle: t('If anyone is in danger, call first', 'কেউ বিপদে থাকলে আগে কল করুন'),\n      emHint: t('Tap a number to call. Planning can wait.', 'কল করতে নম্বরে ট্যাপ করুন। পরিকল্পনা পরে হবে।'),\n      relTag: t('Most useful now', 'এখন সবচেয়ে কাজের'),\n      pathTitle: t('Recovery path', 'পুনরুদ্ধারের পথ'),\n      assessed: t('Assessed 12 Nov 2026', 'মূল্যায়ন ১২ নভেম্বর ২০২৬'),\n      stepsHelp: t('Follow the action card. When access is confirmed safe, choose the last stage to check readiness and planting dates.', 'নির্দেশনা কার্ড অনুসরণ করুন। প্রবেশ নিরাপদ নিশ্চিত হলে প্রস্তুতি ও রোপণের তারিখ দেখতে শেষ ধাপ বেছে নিন।'),\n      nextEyebrow: t('Your next step', 'আপনার পরবর্তী ধাপ'),\n      stronger: t('Make the next season stronger', 'পরের মৌসুমকে আরও শক্ত করুন'),\n      bamis: t('Check current BAMIS advice', 'বর্তমান বামিস পরামর্শ দেখুন'),\n      sources: t('Guidance sources', 'নির্দেশনার উৎস'),\n      sourcesBody: t('Department of Agricultural Extension (DAE), BAMIS weather and crop advisories, Bangladesh Fire Service and Civil Defence, and Department of Disaster Management guidance. Local officials always come first.', 'কৃষি সম্প্রসারণ অধিদপ্তর (ডিএই), বামিস আবহাওয়া ও ফসল পরামর্শ, বাংলাদেশ ফায়ার সার্ভিস ও সিভিল ডিফেন্স এবং দুর্যোগ ব্যবস্থাপনা অধিদপ্তরের নির্দেশনা। স্থানীয় কর্মকর্তাদের কথাই আগে।'),\n      readiness: t('Field readiness', 'জমির প্রস্তুতি'),\n      readinessSub: t('Tick each check once it is done. Do this after the hazard has passed.', 'প্রতিটি পরীক্ষা শেষ হলে টিক দিন। বিপদ কেটে যাওয়ার পর এটি করুন।'),\n      advance: t('Continue to replanting', 'রোপণ পরিকল্পনায় যান'),\n      plantEyebrow: t('Seasonal recovery', 'মৌসুমী পুনরুদ্ধার'),\n      plantTitle: t('When and what to plant', 'কখন ও কী লাগাবেন'),\n      plantTag: t('Rules + published guidance', 'নিয়ম + প্রকাশিত নির্দেশনা'),\n      lockedTitle: t('Resolve these checks first', 'আগে এই পরীক্ষাগুলো শেষ করুন'),\n      lockedNote: t('The crop calendar will open here when the checks are complete.', 'পরীক্ষা শেষ হলে ফসল ক্যালেন্ডার এখানে খুলবে।'),\n      crop: t('Crop', 'ফসল'),\n      today: t('Today, 12 Nov', 'আজ, ১২ নভেম্বর'),\n      calNote: t('Typical windows for northern Bangladesh. Confirm variety and dates with your Upazila Agriculture Officer.', 'উত্তর বাংলাদেশের সাধারণ সময়। জাত ও তারিখ উপজেলা কৃষি কর্মকর্তার সাথে নিশ্চিত করুন।'),\n      soilTitle: t('3. Restore soil, borders and trees', '৩. মাটি, আইল ও গাছ পুনরুদ্ধার'),\n      planTitle: t('4. Keep a recovery plan', '৪. পুনরুদ্ধার পরিকল্পনা রাখুন'),\n      planBody: t('Save this assessment on this device, or take a printed plan to your extension officer. Revisit it when conditions change.', 'এই মূল্যায়ন এই ডিভাইসে সংরক্ষণ করুন, অথবা ছাপানো পরিকল্পনা কৃষি সম্প্রসারণ কর্মকর্তার কাছে নিন। অবস্থা বদলালে আবার দেখুন।'),\n      print: t('Preview / print', 'প্রিভিউ / প্রিন্ট'),\n      json: t('Export JSON', 'JSON রপ্তানি'),\n      sms: t('Text a summary to my officer', 'আমার কর্মকর্তাকে সারসংক্ষেপ এসএমএস'),\n      offline: t('Saved on this device. Works without internet.', 'এই ডিভাইসে সংরক্ষিত। ইন্টারনেট ছাড়াই চলে।'),\n      water: t('Check water demand', 'পানির চাহিদা দেখুন'),\n      log: t('Log crop or soil evidence', 'ফসল বা মাটির প্রমাণ লিখুন'),\n      evTitle: t('5. Record the damage', '৫. ক্ষতির তথ্য রাখুন'),\n      evBody: t('Photos with time and place help with relief and insurance forms. Take them before you clear anything.', 'সময় ও স্থানসহ ছবি ত্রাণ ও বিমার ফর্মে কাজে লাগে। কিছু পরিষ্কারের আগে তুলুন।'),\n      evNote: t('Time and location are added only with your permission.', 'আপনার অনুমতি পেলেই সময় ও স্থান যুক্ত হয়।'),\n      satTitle: t('Satellite check (NASA Prithvi AI)', 'স্যাটেলাইট পরীক্ষা (NASA Prithvi AI)'),\n      satBody: t('Drag to compare your field before and after.', 'আগে ও পরে জমি তুলনা করতে টানুন।'),\n      satNote: t('Illustrative preview. Real scenes appear once you log an event. Radar can see through cloud when optical scenes are skipped.', 'উদাহরণমূলক প্রিভিউ। ঘটনা লগ করলে প্রকৃত দৃশ্য আসবে। অপটিক্যাল দৃশ্য বাদ গেলে রাডার মেঘ ভেদ করে দেখতে পারে।'),\n      sure: t('How sure is this?', 'এটি কতটা নির্ভরযোগ্য?'),\n      sureBody: t('A satellite scene only shows what the sensor saw on that day. Cloud, shadow and small plots can hide detail, so treat this as a prompt to walk the field, not a verdict.', 'স্যাটেলাইট দৃশ্য শুধু ওই দিন সেন্সর যা দেখেছে তা দেখায়। মেঘ, ছায়া ও ছোট জমি বিস্তারিত লুকাতে পারে, তাই এটিকে জমি ঘুরে দেখার ইঙ্গিত ভাবুন, চূড়ান্ত রায় নয়।'),\n      siteName: '',\n      footRight: t('NASA Earth observations · Bangladesh field research', 'NASA ভূ-পর্যবেক্ষণ · বাংলাদেশ মাঠ গবেষণা'),\n    };\n\n    /* ---------- language toggle ---------- */\n    const togOn = 'padding:6px 12px; border:0; border-radius:6px; background:#1f3528; color:#fff; font-size:12.5px; font-weight:600;';\n    const togOff = 'padding:6px 12px; border:0; border-radius:6px; background:transparent; color:#3d463f; font-size:12.5px; font-weight:500;';\n    const langVals = {\n      setEn: () => this.setState({ lang: 'en' }),\n      setBn: () => this.setState({ lang: 'bn' }),\n      isEn: !bn,\n      isBn: bn,\n      enStyle: !bn ? togOn : togOff,\n      bnStyle: bn ? togOn : togOff,\n    };\n\n    /* ---------- sidebar ---------- */\n    const navData = [\n      ['My field', 'আমার জমি'], ['Rotation studio', 'ঘূর্ণন স্টুডিও'], ['Planting planner', 'রোপণ পরিকল্পনা'],\n      ['My plans', 'আমার পরিকল্পনা'], ['Past seasons', 'গত মৌসুম'], ['Crop clinic', 'ফসল ক্লিনিক'], ['Disaster recovery', 'দুর্যোগ পুনরুদ্ধার'],\n    ];\n    const nav = navData.map((n, i) => {\n      const active = i === 6;\n      return {\n        label: t(n[0], n[1]),\n        num: dg('0' + (i + 1)),\n        style: 'display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:9px; text-decoration:none; font-size:13.5px;' + (active ? 'background:#2b4a39; color:#fff; font-weight:500; box-shadow:0 10px 20px -14px rgba(43,74,57,.9);' : 'color:#3d463f;'),\n        numStyle: MONO + 'font-size:10.5px;' + (active ? 'color:#c9d4c3;' : 'color:#7a7e72;'),\n        ic1: i === 0, ic2: i === 1, ic3: i === 2, ic4: i === 3, ic5: i === 4, ic6: i === 5, ic7: i === 6,\n      };\n    });\n\n    /* ---------- sites ---------- */\n    const siteNames = [['Mithapukur', 'মিঠাপুকুর'], ['Pirganj', 'পীরগঞ্জ'], ['Gangachara', 'গঙ্গাচড়া']];\n    ui.siteName = t(siteNames[siteIdx][0], siteNames[siteIdx][1]);\n    const sites = siteNames.map((n, i) => {\n      const on = i === siteIdx;\n      return {\n        name: t(n[0], n[1]),\n        num: dg('0' + (i + 1)),\n        active: on,\n        pick: () => this.setState({ site: i }),\n        style: 'display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:8px; font-size:13px;' + (on ? 'background:#e8ece0; border:1px solid #b4bea4; color:#1d2a22; font-weight:500;' : 'background:#fdfcf7; border:1px solid #e3dfd0; color:#3d463f;'),\n        dotStyle: 'width:6px; height:6px; border-radius:50%; background:' + (on ? '#2b4a39' : '#b9b39b') + ';',\n      };\n    });\n\n    /* ---------- emergency contacts ---------- */\n    const relNum = { flood: '999', storm: '999', fire: '102', drought: '16123' }[hk];\n    const contactBase = [\n      ['999', t('National emergency', 'জাতীয় জরুরি সেবা')],\n      ['102', t('Fire Service', 'ফায়ার সার্ভিস')],\n      ['16123', t('Krishi Call Center', 'কৃষি কল সেন্টার')],\n    ];\n    const contacts = contactBase.map((c) => {\n      const rel = c[0] === relNum;\n      return {\n        num: dg(c[0]),\n        label: c[1],\n        href: 'tel:' + c[0],\n        rel,\n        style: 'flex:1 1 170px; display:flex; align-items:center; justify-content:space-between; gap:10px; text-decoration:none; color:#f6f4ec; padding:12px 16px; border-radius:10px; box-sizing:border-box;' + (rel ? 'background:rgba(246,244,236,.16); border:1px solid rgba(246,244,236,.55);' : 'background:rgba(246,244,236,.07); border:1px solid rgba(246,244,236,.18);'),\n      };\n    });\n\n    /* ---------- hazards ---------- */\n    const hzMeta = [\n      ['flood', 'Flood', 'বন্যা', 'Wait for water to recede. Rebuild around the season.', 'পানি নামার অপেক্ষা করুন। মৌসুম ধরে নতুন করে গড়ুন।'],\n      ['drought', 'Drought', 'খরা', 'Protect moisture. Choose a crop the water can support.', 'আর্দ্রতা রক্ষা করুন। পানির সাথে মানানসই ফসল বাছুন।'],\n      ['fire', 'Fire', 'আগুন', 'Return safely. Check soil, then help the land recover.', 'নিরাপদে ফিরুন। মাটি দেখুন, তারপর জমিকে সেরে উঠতে সাহায্য করুন।'],\n      ['storm', 'Storm and hail', 'ঝড় ও শিলাবৃষ্টি', 'Shelter first. Count damage, then replant what cannot regrow.', 'আগে আশ্রয়। ক্ষতি গুনুন, তারপর যা গজাবে না তা আবার লাগান।'],\n    ];\n    const hazards = hzMeta.map((h) => {\n      const on = h[0] === hk;\n      return {\n        name: t(h[1], h[2]),\n        tag: t(h[3], h[4]),\n        selected: on,\n        pick: () => this.setState({ hazard: h[0], checks: {} }),\n        ink: on ? '#96473a' : '#6b6a5c',\n        isFlood: h[0] === 'flood', isDrought: h[0] === 'drought', isFire: h[0] === 'fire', isStorm: h[0] === 'storm',\n        style: 'flex:1 1 220px; min-width:0; display:flex; align-items:flex-start; gap:14px; text-align:left; box-sizing:border-box; padding:18px; border-radius:12px; position:relative; min-height:112px;' + (on ? 'background:#f0e4de; border:1px solid #c9a698; box-shadow:0 16px 30px -22px rgba(150,71,58,.6);' : 'background:#fdfcf7; border:1px solid #e3dfd0;'),\n        radioStyle: 'flex:none; width:22px; height:22px; border-radius:50%; box-sizing:border-box; display:flex; align-items:center; justify-content:center;' + (on ? 'background:#96473a; border:1px solid #96473a;' : 'background:#fdfcf7; border:1px solid #c9c4ae;'),\n      };\n    });\n\n    /* ---------- stages ---------- */\n    const stageMeta = [\n      [t('Prepare', 'প্রস্তুতি'), t('A warning has been issued', 'সতর্কতা জারি হয়েছে')],\n      [t('Hazard active', 'বিপদ চলছে'), t('Stay safe, stay out', 'নিরাপদ থাকুন, দূরে থাকুন')],\n      [t('Assess', 'পরীক্ষা'), t('Check the field', 'জমি দেখুন')],\n      [t('Replant', 'পুনরায় রোপণ'), t('Plan the season', 'মৌসুম ঠিক করুন')],\n    ];\n    const curColor = alert ? '#96473a' : '#2b4a39';\n    const steps = stageMeta.map((m, i) => {\n      const n = i + 1;\n      const done = n < stage;\n      const cur = n === stage;\n      return {\n        n: dg(n),\n        label: m[0],\n        sub: m[1],\n        done,\n        notDone: !done,\n        aria: cur ? 'step' : 'false',\n        pick: () => this.setState({ stage: n }),\n        dotStyle: 'flex:none; width:36px; height:36px; border-radius:50%; box-sizing:border-box; display:flex; align-items:center; justify-content:center;' + MONO + 'font-size:13px;' + (done ? 'background:#2b4a39; border:1px solid #2b4a39;' : cur ? 'background:' + curColor + '; border:1px solid ' + curColor + '; color:#fff; box-shadow:0 0 0 5px ' + (alert ? 'rgba(150,71,58,.16)' : 'rgba(43,74,57,.16)') + ';' : 'background:#fdfcf7; border:1px solid #c9c4ae; color:#5d6256;'),\n        lineStyle: 'flex:1; height:2px; border-radius:2px;' + (i === 3 ? 'display:none;' : done ? 'background:#2b4a39;' : 'background:#e3dfd0;'),\n      };\n    });\n\n    /* ---------- hazard content ---------- */\n    const STEP = {\n      flood: [\n        ['Secure what you can before the water rises', 'Harvest ready crops early. Move seed, fertiliser and tools above flood level, and plan a safe place for livestock. Follow union council and shelter announcements.', 'পানি বাড়ার আগে যা সম্ভব সুরক্ষিত করুন', 'পাকা ফসল আগে কেটে নিন। বীজ, সার ও যন্ত্রপাতি বন্যার স্তরের উপরে সরান, গবাদিপশুর জন্য নিরাপদ জায়গা ঠিক করুন। ইউনিয়ন পরিষদ ও আশ্রয়কেন্দ্রের ঘোষণা মেনে চলুন।'],\n        ['Stay out of the water', 'Move people and livestock to higher ground. Do not walk or drive through flood water. Call 999 in an emergency. Do not return to check crops until officials say it is safe.', 'পানিতে নামবেন না', 'মানুষ ও গবাদিপশুকে উঁচু জায়গায় সরান। বন্যার পানিতে হাঁটবেন বা গাড়ি চালাবেন না। জরুরি অবস্থায় ৯৯৯-এ কল করুন। কর্তৃপক্ষ নিরাপদ না বলা পর্যন্ত ফসল দেখতে ফিরবেন না।'],\n        ['Check the field before you act', 'When the water has receded and access is safe, walk the boundaries, check embankments and drains, and photograph the damage before you clear anything.', 'কাজ শুরুর আগে জমি পরীক্ষা করুন', 'পানি নেমে গেলে ও পথ নিরাপদ হলে জমির সীমানা, বাঁধ ও নালা দেখুন এবং কিছু পরিষ্কারের আগে ক্ষতির ছবি তুলুন।'],\n        ['Plant fast, short-duration crops first', 'Choose crops that mature before the dry season, and check silt depth and drainage before sowing. Ask your agriculture officer about seed support.', 'আগে কম সময়ের ফসল লাগান', 'শুষ্ক মৌসুমের আগে পাকে এমন ফসল বেছে নিন, বপনের আগে পলির গভীরতা ও পানি নিষ্কাশন দেখুন। বীজ সহায়তার জন্য উপজেলা কৃষি কর্মকর্তাকে জিজ্ঞেস করুন।'],\n      ],\n      drought: [\n        ['Plan your water before it runs short', 'List which plots matter most, mulch them, and check your water source. Delay planting thirsty crops until you know what you can rely on.', 'পানি কমার আগে পরিকল্পনা করুন', 'কোন জমি সবচেয়ে গুরুত্বপূর্ণ তার তালিকা করুন, মালচ দিন, পানির উৎস দেখুন। বেশি পানি লাগে এমন ফসল লাগাতে দেরি করুন।'],\n        ['Protect moisture, not every plant', 'Water the highest-value plots early or late in the day and mulch them. Stop irrigating plots that cannot recover. Ask the Krishi Call Center on 16123 for advice.', 'সব গাছ নয়, আর্দ্রতা রক্ষা করুন', 'সবচেয়ে মূল্যবান জমিতে সকালে বা বিকেলে সেচ দিন ও মালচ দিন। যে জমি আর বাঁচানো যাবে না সেখানে সেচ বন্ধ করুন। পরামর্শের জন্য কৃষি কল সেন্টার ১৬১২৩-এ কল করুন।'],\n        ['Measure what is left', 'Check soil moisture a hand-depth down, count surviving plants by plot, and note the level of your water source before you decide anything.', 'কতটুকু বাকি আছে মাপুন', 'কিছু ঠিক করার আগে হাত-গভীরতায় মাটির আর্দ্রতা দেখুন, জমিভিত্তিক বেঁচে থাকা গাছ গুনুন, পানির উৎসের স্তর লিখে রাখুন।'],\n        ['Choose crops the water can support', 'Prefer short-duration or low-water crops sized to the water you can count on, and stagger sowing so one dry spell does not take everything.', 'পানির সাথে মানানসই ফসল বাছুন', 'কম সময়ের বা কম পানির ফসল বেছে নিন, নিশ্চিতভাবে যত পানি পাবেন সেই অনুযায়ী ধাপে ধাপে বপন করুন, যাতে একটি শুষ্ক সময়ে সব নষ্ট না হয়।'],\n      ],\n      fire: [\n        ['Clear a safety break', 'Remove dry stubble and straw near homes and stores, keep water within reach, and know the Fire Service number, 102.', 'নিরাপত্তা বেষ্টনী তৈরি করুন', 'বাড়ি ও গুদামের কাছ থেকে শুকনো নাড়া ও খড় সরান, হাতের কাছে পানি রাখুন, ফায়ার সার্ভিসের ১০২ নম্বর মনে রাখুন।'],\n        ['The hazard is still active', 'Leave the danger area and follow emergency instructions. Call Bangladesh Fire Service 102 for a fire emergency. Do not re-enter for tools or crops.', 'বিপদ এখনও চলছে', 'বিপজ্জনক এলাকা ছেড়ে যান এবং জরুরি নির্দেশনা মানুন। অগ্নিকাণ্ডে ফায়ার সার্ভিস ১০২-এ কল করুন। যন্ত্রপাতি বা ফসলের জন্য আবার ভেতরে ঢুকবেন না।'],\n        ['Check the ground before touching it', 'Wait for the all-clear. Then look for hot spots, photograph the burn boundaries, and keep children and animals away until the ash is cool.', 'ছোঁয়ার আগে মাটি পরীক্ষা করুন', 'নিরাপদ ঘোষণার অপেক্ষা করুন। তারপর গরম জায়গা আছে কি না দেখুন, পোড়া সীমানার ছবি তুলুন, ছাই ঠান্ডা না হওয়া পর্যন্ত শিশু ও পশুকে দূরে রাখুন।'],\n        ['Rebuild cover before you rebuild yield', 'Do not spread mixed fire ash as fertiliser. Agree erosion control and regrowth monitoring with local support before choosing replacement trees.', 'ফলনের আগে আচ্ছাদন ফিরিয়ে আনুন', 'মিশ্র পোড়া ছাই সার হিসেবে ছড়াবেন না। নতুন গাছ বাছার আগে স্থানীয় সহায়তায় মাটি ক্ষয় রোধ ও পুনর্বৃদ্ধির পর্যবেক্ষণ ঠিক করুন।'],\n      ],\n      storm: [\n        ['Brace and bring in', 'Harvest mature crops if you can, prop tall crops, clear drains, and move people to a sturdy shelter as warnings rise.', 'শক্ত করে বাঁধুন, ঘরে তুলুন', 'সম্ভব হলে পাকা ফসল তুলুন, লম্বা ফসলে ঠেকনা দিন, নালা পরিষ্কার করুন, সতর্কতা বাড়লে মানুষকে মজবুত আশ্রয়ে নিন।'],\n        ['Shelter first, fields later', 'Stay in a sturdy building away from trees and wires. Call 999 in an emergency. Do not go out until the all-clear.', 'আগে আশ্রয়, পরে জমি', 'গাছ ও বিদ্যুতের তার থেকে দূরে মজবুত ভবনে থাকুন। জরুরি অবস্থায় ৯৯৯-এ কল করুন। নিরাপদ ঘোষণার আগে বের হবেন না।'],\n        ['Walk the damage, then decide', 'Check for fallen lines, broken stems and flooded patches. Photograph the damage before clearing it, for relief and insurance records.', 'ক্ষতি দেখে তারপর সিদ্ধান্ত নিন', 'ছেঁড়া তার, ভাঙা কাণ্ড ও জলমগ্ন অংশ দেখুন। ত্রাণ ও বিমার জন্য পরিষ্কারের আগে ক্ষতির ছবি তুলুন।'],\n        ['Replace only what cannot recover', 'Many damaged plants regrow. Fix drainage first, then replant bare patches with short-duration crops.', 'যা বাঁচবে না শুধু তাই বদলান', 'অনেক ক্ষতিগ্রস্ত গাছ আবার গজায়। আগে নিষ্কাশন ঠিক করুন, তারপর ফাঁকা অংশে কম সময়ের ফসল লাগান।'],\n      ],\n    };\n    const TIP = {\n      flood: ['Raise seedbeds and keep a reserve of short-duration seed. Mark the highest water line on a post so next year you know the real risk.', 'বীজতলা উঁচু করুন এবং কম সময়ের বীজ মজুত রাখুন। খুঁটিতে সর্বোচ্চ পানির দাগ চিহ্নিত করুন, যাতে আগামী বছর প্রকৃত ঝুঁকি বোঝা যায়।'],\n      drought: ['Mulch after every sowing and note which plots dry first. Ask neighbours about shared water points before the dry months.', 'প্রতিবার বপনের পর মালচ দিন এবং কোন জমি আগে শুকায় তা লিখে রাখুন। শুষ্ক মাসের আগে প্রতিবেশীদের সাথে যৌথ পানির উৎস নিয়ে কথা বলুন।'],\n      fire: ['Keep a cleared strip around stacks and stores. Agree who calls 102 and who moves the livestock before a fire starts.', 'গাদা ও গুদামের চারপাশে পরিষ্কার জায়গা রাখুন। আগুন লাগার আগেই ঠিক করুন কে ১০২-এ কল করবে ও কে গবাদিপশু সরাবে।'],\n      storm: ['Plant a windbreak on the windward side and tie tall crops early. Keep drains open before the stormy season starts.', 'বাতাসের দিকে বাতাস-প্রতিরোধী গাছের সারি লাগান এবং লম্বা ফসল আগেই বাঁধুন। ঝড়ের মৌসুমের আগে নালা খোলা রাখুন।'],\n    };\n    const CHK = {\n      flood: [['Water has left the field and the road is safe', 'জমি থেকে পানি নেমেছে এবং পথ নিরাপদ'], ['Embankments and drains inspected', 'বাঁধ ও নালা পরীক্ষা করা হয়েছে'], ['Silt depth and soil smell noted', 'পলির গভীরতা ও মাটির গন্ধ লেখা হয়েছে'], ['Wells and ponds checked before irrigating', 'সেচের আগে কুয়া ও পুকুর পরীক্ষা করা হয়েছে']],\n      drought: [['Soil moisture checked a hand-depth down', 'হাত-গভীরতায় মাটির আর্দ্রতা দেখা হয়েছে'], ['Surviving plants counted by plot', 'জমিভিত্তিক বেঁচে থাকা গাছ গোনা হয়েছে'], ['Water source level noted', 'পানির উৎসের স্তর লেখা হয়েছে'], ['Priority plots chosen for water', 'পানির জন্য অগ্রাধিকার জমি ঠিক করা হয়েছে']],\n      fire: [['Fire Service or officials gave the all-clear', 'ফায়ার সার্ভিস বা কর্তৃপক্ষ নিরাপদ ঘোষণা দিয়েছে'], ['Hot spots and smouldering roots checked', 'গরম জায়গা ও ধিকিধিকি জ্বলা শিকড় দেখা হয়েছে'], ['Burn boundary photographed', 'পোড়া সীমানার ছবি তোলা হয়েছে'], ['Ash crust and bare soil noted', 'ছাইয়ের স্তর ও খোলা মাটি লেখা হয়েছে']],\n      storm: [['Trees, poles and walls checked as stable', 'গাছ, খুঁটি ও দেয়াল স্থির কি না দেখা হয়েছে'], ['Broken stems and lodged crops counted', 'ভাঙা কাণ্ড ও হেলে পড়া ফসল গোনা হয়েছে'], ['Drains cleared of debris', 'নালা থেকে আবর্জনা সরানো হয়েছে'], ['Damage photographed for relief records', 'ত্রাণের জন্য ক্ষতির ছবি তোলা হয়েছে']],\n    };\n    const SOIL = {\n      flood: [['Rebuild low spots in field borders before sowing so the next rise is slowed.', 'পরের বন্যা ধীর করতে বপনের আগে জমির নিচু আইল উঁচু করুন।'], ['Spread silt evenly rather than leaving thick heaps, and dig drains to the nearest outlet.', 'পলি সমানভাবে ছড়িয়ে দিন, পুরু স্তূপ রাখবেন না; নিকটতম নিষ্কাশন পথে নালা কাটুন।']],\n      drought: [['Cover bare soil with straw or crop residue to hold what moisture remains.', 'অবশিষ্ট আর্দ্রতা ধরে রাখতে খোলা মাটি খড় বা ফসলের অবশেষে ঢেকে দিন।'], ['Plant a few drought-tolerant trees or shrubs on field borders for shade and wind protection.', 'ছায়া ও বাতাস থেকে সুরক্ষার জন্য আইলে কিছু খরা-সহনশীল গাছ লাগান।']],\n      fire: [['Keep the burnt area covered with grass or residue so rain does not wash the topsoil away.', 'বৃষ্টিতে উপরের মাটি ধুয়ে না যেতে পোড়া জায়গা ঘাস বা অবশেষে ঢেকে রাখুন।'], ['Wait for local forestry or extension advice before replacing trees.', 'গাছ বদলানোর আগে স্থানীয় বন বা কৃষি সম্প্রসারণ কর্মকর্তার পরামর্শের অপেক্ষা করুন।']],\n      storm: [['Re-stake or trim damaged trees only after checking they are stable.', 'ক্ষতিগ্রস্ত গাছ স্থির কি না দেখে তারপর ঠেকনা দিন বা ছাঁটুন।'], ['Open blocked drains first so standing water does not follow the wind damage.', 'বাতাসের ক্ষতির পরে জলাবদ্ধতা এড়াতে আগে বন্ধ নালা খুলুন।']],\n    };\n    const CROPS = {\n      flood: [['Leafy greens', 'শাকসবজি (লাল শাক, পালং)', 'Quick cover while the soil settles', 'মাটি বসার সময় দ্রুত আচ্ছাদন', 0.3, 2.4], ['Mustard', 'সরিষা', 'Short-duration oilseed after silt is levelled', 'পলি সমান করার পর কম সময়ের তেলবীজ', 0.2, 1.6], ['Boro seedbed', 'বোরো বীজতলা', 'Raise seedlings on a drained, higher bed', 'নিষ্কাশিত উঁচু বেডে চারা তৈরি করুন', 1.5, 2.6]],\n      drought: [['Lentil', 'মসুর', 'A pulse that needs little water', 'কম পানিতে হয় এমন ডাল', 0.4, 1.8], ['Mustard', 'সরিষা', 'Sow into stored soil moisture', 'মাটিতে জমে থাকা আর্দ্রতায় বপন করুন', 0.2, 1.6], ['Chickpea', 'ছোলা', 'Deep-rooted, suits lighter irrigation', 'গভীর শিকড়, কম সেচে মানায়', 0.5, 1.9]],\n      fire: [['Lentil cover', 'মসুর (আচ্ছাদন)', 'Legume cover to hold the soil', 'মাটি ধরে রাখতে ডালজাতীয় আচ্ছাদন', 0.5, 2.0], ['Mustard', 'সরিষা', 'Only after the ash has been checked', 'ছাই পরীক্ষার পরই', 0.4, 1.6], ['Grass strips', 'ঘাসের বেষ্টনী', 'Slow runoff on slopes and borders', 'ঢাল ও আইলে পানির প্রবাহ ধীর করে', 0.2, 3.4]],\n      storm: [['Radish', 'মূলা', 'Fast crop for bare patches', 'ফাঁকা অংশের জন্য দ্রুত ফসল', 0.3, 2.0], ['Leafy greens', 'শাকসবজি', 'Replant where stems did not regrow', 'যেখানে কাণ্ড গজায়নি সেখানে আবার লাগান', 0.3, 2.3], ['Potato', 'আলু', 'If drains are open and soil is not waterlogged', 'নালা খোলা ও মাটি জলাবদ্ধ না হলে', 0.4, 1.5]],\n    };\n    const LOCK = {\n      flood: ['Keep people safe first. Planting dates open after the water has gone and access is confirmed safe.', 'আগে মানুষকে নিরাপদ রাখুন। পানি নেমে গিয়ে প্রবেশ নিরাপদ নিশ্চিত হলে রোপণের তারিখ খুলবে।'],\n      drought: ['Plan the water you can count on first. Planting dates open once you have measured what is left.', 'আগে যে পানির উপর ভরসা করা যায় তার পরিকল্পনা করুন। কতটুকু বাকি আছে মাপা হলে রোপণের তারিখ খুলবে।'],\n      fire: ['Keep people safe first. Planting dates open after the all-clear and a check of the ground.', 'আগে মানুষকে নিরাপদ রাখুন। নিরাপদ ঘোষণা ও মাটি পরীক্ষার পর রোপণের তারিখ খুলবে।'],\n      storm: ['Keep people safe first. Planting dates open after the storm has passed and damage is recorded.', 'আগে মানুষকে নিরাপদ রাখুন। ঝড় কেটে গিয়ে ক্ষতি লেখা হলে রোপণের তারিখ খুলবে।'],\n    };\n\n    /* ---------- next step card ---------- */\n    const sd = STEP[hk][stage - 1];\n    const ctaCall = stage <= 2;\n    const contactLabel = { '999': t('National emergency', 'জাতীয় জরুরি সেবা'), '102': t('Fire Service', 'ফায়ার সার্ভিস'), '16123': t('Krishi Call Center', 'কৃষি কল সেন্টার') }[relNum];\n    const ns = {\n      title: t(sd[0], sd[2]),\n      body: t(sd[1], sd[3]),\n      tip: t(TIP[hk][0], TIP[hk][1]),\n      cardStyle: 'flex:1.7 1 520px; min-width:0; box-sizing:border-box; border-radius:12px; padding:28px 28px 24px; display:flex; flex-direction:column; gap:18px;' + (alert ? 'background:#f0e4de; border:1px solid #d4b3a7;' : 'background:#e8ece0; border:1px solid #c3cdb5;'),\n      eyebrowStyle: MONO + 'font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:' + (alert ? '#8a3f33' : '#2b4a39') + ';',\n      ctaIsCall: ctaCall,\n      ctaIsArrow: !ctaCall,\n      ctaHref: ctaCall ? 'tel:' + relNum : stage === 3 ? '#evidence' : '#plant',\n      ctaLabel: ctaCall ? t('Call ', 'কল করুন ') + dg(relNum) + ' · ' + contactLabel : stage === 3 ? t('Record the damage', 'ক্ষতির তথ্য রাখুন') : t('See the planting window', 'রোপণের সময় দেখুন'),\n      ctaStyle: 'display:inline-flex; align-items:center; gap:10px; padding:13px 20px; border-radius:9px; text-decoration:none; color:#fff; font-weight:500; font-size:14px;' + (alert ? 'background:#96473a; box-shadow:0 14px 24px -14px rgba(150,71,58,.9);' : 'background:#2b4a39; box-shadow:0 14px 24px -14px rgba(43,74,57,.9);'),\n    };\n\n    /* ---------- readiness ---------- */\n    const chkList = CHK[hk];\n    const checks = chkList.map((c, i) => {\n      const key = hk + '-' + i;\n      const on = !!checksState[key];\n      return {\n        text: t(c[0], c[1]),\n        checked: on,\n        toggle: () => this.setState({ checks: { ...(this.state.checks || {}), [key]: !(this.state.checks || {})[key] } }),\n        style: 'display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:9px; cursor:pointer;' + (on ? 'background:#e8ece0; border:1px solid #c3cdb5;' : 'background:#fdfcf7; border:1px solid #e3dfd0;'),\n      };\n    });\n    const doneCount = checks.filter((c) => c.checked).length;\n    const total = checks.length;\n    const allDone = doneCount === total;\n    const rd = {\n      pct: dg(Math.round((doneCount / total) * 100)) + (bn ? '%' : '%'),\n      offset: (213.63 * (1 - doneCount / total)).toFixed(2),\n      count: t(doneCount + ' of ' + total + ' checks done', dg(total) + 'টির মধ্যে ' + dg(doneCount) + 'টি সম্পন্ন'),\n      notReady: !allDone,\n      advance: () => this.setState({ stage: 4 }),\n      btnStyle: 'display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:13px 18px; border-radius:9px; border:0; font-size:14px; font-weight:500;' + (allDone ? 'background:#2b4a39; color:#fff; box-shadow:0 14px 24px -14px rgba(43,74,57,.9);' : 'background:#ebe8db; color:#7a7e72;'),\n    };\n\n    /* ---------- planting calendar ---------- */\n    const monthsEn = ['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr'];\n    const monthsBn = ['নভেম্বর', 'ডিসেম্বর', 'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল'];\n    const rows = CROPS[hk].map((c) => {\n      const a = Math.floor(c[4]);\n      const b = Math.min(5, Math.ceil(c[5]) - 1);\n      const open = c[4] <= 0.4;\n      return {\n        name: t(c[0], c[1]),\n        note: t(c[2], c[3]),\n        window: (bn ? monthsBn[a] : monthsEn[a]) + ' – ' + (bn ? monthsBn[b] : monthsEn[b]),\n        barStyle: 'position:absolute; top:4px; bottom:4px; display:flex; align-items:center; border-radius:5px; color:#fff; font-size:11.5px; font-weight:500; overflow:hidden; box-sizing:border-box;left:' + ((c[4] / 6) * 100).toFixed(2) + '%; width:' + (((c[5] - c[4]) / 6) * 100).toFixed(2) + '%;' + (open ? 'background:#2b4a39;' : 'background:#6f8c75;'),\n      };\n    });\n    const remaining = checks.filter((c) => !c.checked).slice(0, 2).map((c) => ({ text: c.text }));\n    const lockedItems = [{ text: t(LOCK[hk][0], LOCK[hk][1]) }].concat(remaining);\n    const plant = {\n      locked: stage < 4,\n      open: stage >= 4,\n      lockedItems,\n      months: (bn ? monthsBn : monthsEn).map((m) => ({ label: m })),\n      rows,\n    };\n\n    /* ---------- soil ---------- */\n    const soil = SOIL[hk].map((x) => ({ text: t(x[0], x[1]) }));\n\n    /* ---------- plan ---------- */\n    const saved = !!s.saved;\n    const plan = {\n      saved,\n      save: () => this.setState({ saved: true }),\n      saveLabel: saved ? t('Saved', 'সংরক্ষিত') : t('Save assessment', 'মূল্যায়ন সংরক্ষণ'),\n      saveStyle: 'display:inline-flex; align-items:center; gap:8px; padding:11px 16px; border-radius:8px; border:0; font-size:13px; font-weight:500; color:#fff;' + (saved ? 'background:#4f7a5a;' : 'background:#2b4a39;'),\n    };\n\n    /* ---------- evidence ---------- */\n    const slotData = [\n      [t('Field boundary', 'জমির সীমানা'), t('Wide shot from the edge', 'প্রান্ত থেকে চওড়া ছবি')],\n      [t('Soil surface', 'মাটির উপরিভাগ'), t('Close-up with a hand for scale', 'হাত রেখে কাছ থেকে ছবি')],\n      [t('Crop or tree damage', 'ফসল বা গাছের ক্ষতি'), t('Three typical plants', 'তিনটি সাধারণ গাছ')],\n    ];\n    const slots = slotData.map((d, i) => {\n      const on = !!evState[i];\n      return {\n        label: d[0],\n        hint: d[1],\n        done: on,\n        notDone: !on,\n        state: on ? t('Recorded', 'রেকর্ড হয়েছে') : t('Add photo', 'ছবি যোগ করুন'),\n        toggle: () => this.setState({ ev: { ...(this.state.ev || {}), [i]: !(this.state.ev || {})[i] } }),\n        style: 'display:flex; align-items:center; gap:14px; width:100%; box-sizing:border-box; padding:10px 14px 10px 10px; border-radius:10px;' + (on ? 'background:#e8ece0; border:1px solid #c3cdb5;' : 'background:#fdfcf7; border:1px solid #e3dfd0;'),\n        thumbStyle: 'flex:none; width:52px; height:52px; border-radius:8px; display:flex; align-items:center; justify-content:center;' + (on ? 'background:#2b4a39;' : 'background:repeating-linear-gradient(45deg,#f1eee2 0,#f1eee2 7px,#e8e4d6 7px,#e8e4d6 14px); border:1px dashed #c9c4ae;'),\n        tagStyle: MONO + 'flex:none; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 9px; border-radius:20px;' + (on ? 'background:#2b4a39; color:#fff;' : 'background:#f1efe5; color:#3d463f; border:1px solid #d9d5c4;'),\n      };\n    });\n    const evDone = slots.filter((x) => x.done).length;\n    const ev = { slots, count: t(evDone + ' of 3 recorded', dg(3) + 'টির মধ্যে ' + dg(evDone) + 'টি রেকর্ড') };\n\n    /* ---------- satellite ---------- */\n    const overlayMap = { flood: '#3f7f8e', drought: '#c8a05a', fire: '#3a2d28', storm: '#5f7550' };\n    const legendMap = { flood: t('Standing water', 'জমে থাকা পানি'), drought: t('Dry, stressed crop', 'শুকনো, চাপে থাকা ফসল'), fire: t('Burn scar', 'পোড়া দাগ'), storm: t('Flattened crop', 'হেলে পড়া ফসল') };\n    const slide = Math.min(92, Math.max(8, Number(s.slide == null ? 58 : s.slide)));\n    const clipW = Math.round((slide / 100) * 640);\n    const sat = {\n      overlay: overlayMap[hk],\n      legend: legendMap[hk],\n      clipW,\n      arrowL: clipW - 6,\n      arrowR: clipW + 6,\n      value: slide,\n      afterLabel: t('AFTER', 'পরে'),\n      beforeLabel: t('BEFORE', 'আগে'),\n      alt: t('Illustrative before and after satellite view of a field: ', 'একটি জমির আগে ও পরের উদাহরণমূলক স্যাটেলাইট দৃশ্য: ') + legendMap[hk],\n      onSlide: (e) => this.setState({ slide: Number(e && e.target ? e.target.value : 58) }),\n    };\n\n    return { ui, lang: langVals, nav, sites, contacts, hazards, steps, ns, rd, checks, plant, soil, plan, ev, sat };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
